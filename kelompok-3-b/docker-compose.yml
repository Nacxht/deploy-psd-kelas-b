services:
  sawmill-detector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8026:5000"
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      WA_NOTIFICATION_ENABLED: ${WA_NOTIFICATION_ENABLED:-false}
      WA_METHOD: ${WA_METHOD:-webhook}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WA_TARGET_PHONE: ${WA_TARGET_PHONE:-}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
