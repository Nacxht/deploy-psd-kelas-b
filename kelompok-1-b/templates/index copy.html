<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Deteksi Knalpot Real-time</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #333;
    margin: 0;
    font-family: sans-serif;
  }

  /* Canvas untuk Grafik Suara */
  #visualizer {
    position: absolute;
    top: 20px;
    width: 80%;
    max-width: 600px;
    height: 100px;
    background-color: #222;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 2px solid #555;
  }

  .scene {
    position: relative;
    width: 400px;
    height: 300px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 50px;
    margin-top: 80px; /* Memberi ruang untuk canvas di atas */
  }
  .base-machine {
    position: absolute; bottom: 20px; right: 80px; width: 60px; height: 140px;
    background-color: #7a7a7a; border-radius: 4px; z-index: 2;
    box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
  }
  .base-pad {
    position: absolute; bottom: 0; right: 70px; width: 80px; height: 20px;
    background-color: #e0e0e0; border-radius: 2px; z-index: 1;
  }
  .arm {
    position: absolute; bottom: 125px; right: 120px; width: 250px; height: 20px;
    background: repeating-linear-gradient(-45deg, #000000, #000000 15px, #f1c40f 15px, #f1c40f 30px);
    border: 2px solid #fff; border-radius: 3px; z-index: 3;
    transform-origin: calc(100% - 10px) center; 
    transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pivot {
    position: absolute; bottom: 125px; right: 110px; width: 24px; height: 24px;
    background-color: #ddd; border-radius: 50%; z-index: 4;
    transform: translateY(12px); box-shadow: 0 0 5px rgba(0,0,0,0.5) inset;
  }
  
  /* Class untuk membuka portal */
  .arm.open { transform: rotate(90deg); }
  
  #statusBox {
    margin-top: 30px; padding: 15px 30px; font-size: 20px; font-weight: bold;
    color: white; border-radius: 8px; background-color: #6c757d;
  }
  button {
    margin-top: 20px; padding: 12px 24px; font-size: 16px; cursor: pointer;
    background-color: #007bff; color: white; border: none; border-radius: 5px;
    z-index: 10;
  }
</style>
</head>
<body>

  <!-- Canvas Grafik Suara -->
  <canvas id="visualizer"></canvas>

  <div class="scene">
    <!-- Tambahkan class 'open' secara default -->
    <div class="arm open" id="barrierArm"></div>
    <div class="pivot"></div>
    <div class="base-machine"></div>
    <div class="base-pad"></div>
  </div>

  <div id="statusBox">Menunggu... Portal Terbuka</div>
  <button id="startBtn" onclick="mulaiDeteksi()">Mulai Deteksi Real-time</button>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    // Setup Canvas
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    // Menyesuaikan ukuran resolusi internal canvas dengan ukuran tampilannya
    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    async function mulaiDeteksi() {
      if(isRecording) return;
      document.getElementById('startBtn').style.display = 'none';
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // ==== INISIALISASI GRAFIK SUARA (WEB AUDIO API) ====
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = audioCtx.createAnalyser();
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        
        analyser.fftSize = 128; // Resolusi bar grafik
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        // Fungsi loop untuk menggambar grafik secara terus-menerus
        function drawVisualizer() {
          requestAnimationFrame(drawVisualizer);
          
          analyser.getByteFrequencyData(dataArray);
          
          // Bersihkan frame sebelumnya (latar belakang gelap)
          canvasCtx.fillStyle = '#222';
          canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
          
          const barWidth = (canvas.width / bufferLength) * 2.5;
          let barHeight;
          let x = 0;
          
          for(let i = 0; i < bufferLength; i++) {
            barHeight = dataArray[i] / 2.5; // Skala tinggi bar
            
            // Warna bar berubah dari hijau ke merah berdasarkan tinggi volume/frekuensi
            const r = barHeight + (25 * (i/bufferLength));
            const g = 250 * (1 - (i/bufferLength));
            const b = 50;
            
            canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
            canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            
            x += barWidth + 2; // Jarak antar bar
          }
        }
        drawVisualizer(); // Mulai animasi grafik
        // ===================================================

        // ==== LOOP PEREKAMAN UNTUK MACHINE LEARNING ====
        function recordLoop() {
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { audioChunks.push(e.data); };
          
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            audioChunks = [];
            
            const formData = new FormData();
            formData.append('audio', audioBlob, 'rekaman.wav');

            try {
              const response = await fetch('/predict', { method: 'POST', body: formData });
              const data = await response.json();
              updatePortal(data.hasil);
            } catch(err) {
              console.error("Gagal menghubungi server", err);
            }
            
            recordLoop(); 
          };

          mediaRecorder.start();
          setTimeout(() => { mediaRecorder.stop(); }, 3000); 
        }
        
        isRecording = true;
        recordLoop();

      } catch (err) {
        alert("Izin microphone ditolak atau perangkat tidak ditemukan.");
        console.error(err);
      }
    }

    function updatePortal(hasil) {
      const arm = document.getElementById('barrierArm');
      const statusBox = document.getElementById('statusBox');

      if (hasil === "STANDART") {
        arm.classList.remove('open'); // Portal Tutup
        statusBox.innerText = "Terdeteksi Knalpot Brong! - PORTAL DITUTUP";
        statusBox.style.backgroundColor = "#dc3545"; // Merah
        
      } else if (hasil === "BRONG") {
        arm.classList.add('open'); // Portal Buka
        statusBox.innerText = "Suara Knalpot Standart - PORTAL TERBUKA";
        statusBox.style.backgroundColor = "#28a745"; // Hijau
        
      } else {
        arm.classList.add('open'); // Portal Tetap Buka
        statusBox.innerText = "Menunggu suara motor... - PORTAL TERBUKA";
        statusBox.style.backgroundColor = "#6c757d"; // Abu-abu
      }
    }
  </script>

</body>
</html>
